name: Compila Angerona

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Chiave di firma (facoltativa)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANGERONA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/angerona.jks"
            echo "ANGERONA_KEYSTORE_FILE=$RUNNER_TEMP/angerona.jks" >> "$GITHUB_ENV"
          fi
      - name: Compila
        working-directory: android
        env:
          ANGERONA_KEYSTORE_PASSWORD: ${{ secrets.ANGERONA_KEYSTORE_PASSWORD }}
          ANGERONA_KEY_ALIAS: ${{ secrets.ANGERONA_KEY_ALIAS }}
          ANGERONA_KEY_PASSWORD: ${{ secrets.ANGERONA_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleRelease
      - name: Rinomina gli APK
        run: |
          mkdir -p out
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release.*\.apk/\1/')
            cp "$f" "out/Angerona-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Angerona-Android
          path: out/*.apk

  windows:
    name: Installer Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Aggiorna le liste anti-tracker
        run: npm run filters
        continue-on-error: true
      - run: npx electron-builder --win --x64
      - uses: actions/upload-artifact@v4
        with:
          name: Angerona-Windows
          path: desktop/dist/*.exe

  release:
    name: Pubblica la versione
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
