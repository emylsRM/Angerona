name: Compila Angerona

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Ogni lunedì: ricompila con l'ultimo motore Firefox e le liste anti-tracker aggiornate.
    - cron: '17 5 * * 1'

# Permessi minimi: solo la pubblicazione della versione può scrivere sul repository.
permissions:
  contents: read

env:
  # Ogni compilazione ha un numero crescente: è quello che le app confrontano per proporre l'aggiornamento.
  ANGERONA_VERSION: 1.0.${{ github.run_number }}
  ANGERONA_VERSION_CODE: ${{ github.run_number }}

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Licenze Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANGERONA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/angerona.jks"
            echo "ANGERONA_KEYSTORE_FILE=$RUNNER_TEMP/angerona.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Chiave di firma non impostata: l'APK usa una chiave temporanea e non si aggiorna sopra la versione installata."
          fi

      - name: Compila
        working-directory: android
        env:
          ANGERONA_KEYSTORE_PASSWORD: ${{ secrets.ANGERONA_KEYSTORE_PASSWORD }}
          ANGERONA_KEY_ALIAS: ${{ secrets.ANGERONA_KEY_ALIAS }}
          ANGERONA_KEY_PASSWORD: ${{ secrets.ANGERONA_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Rinomina gli APK
        run: |
          mkdir -p out
          for f in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release.*\.apk/\1/')
            cp "$f" "out/Angerona-android-$abi.apk"
          done
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Angerona-Android
          path: out/*.apk

  windows:
    name: Installer Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - run: npm ci

      - name: Numero di versione
        run: npm version ${{ env.ANGERONA_VERSION }} --no-git-tag-version --allow-same-version

      - name: Aggiorna le liste anti-tracker
        run: npm run filters
        continue-on-error: true

      - run: npx electron-builder --win --x64

      # Prova d'avvio dell'app compilata (con fusibili e controllo di integrità attivi): interfaccia e
      # pagina iniziale devono caricarsi. Se fallisce, la versione non viene pubblicata.
      - name: Prova d'avvio
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/win-unpacked/Angerona.exe').Path
          npx --no-install electron-fuses read --app $exe
          $out = Join-Path $env:RUNNER_TEMP 'angerona-selftest.txt'
          $env:ANGERONA_SELFTEST = $out
          $p = Start-Process -FilePath $exe -PassThru
          $finished = $p.WaitForExit(120000)
          Get-Process -Name Angerona -ErrorAction SilentlyContinue | Stop-Process -Force
          $result = if (Test-Path $out) { (Get-Content $out -Raw).Trim() } else { 'nessun risultato' }
          Write-Host "Prova di avvio: $result"
          if (-not $finished -or $result -ne 'ok') { Write-Error "Angerona non si avvia correttamente: $result"; exit 1 }
          exit 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Angerona-Windows
          path: desktop/dist/*.exe

  release:
    name: Pubblica la versione
    if: github.event_name != 'pull_request'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          merge-multiple: true

      - name: Impronte SHA-256
        working-directory: files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Attestato firmato: chiunque può verificare che i file sono stati compilati qui
      # (gh attestation verify FILE -R emylsRM/Angerona).
      - name: Attestato di provenienza
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        continue-on-error: true
        with:
          subject-path: 'files/*'

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.ANGERONA_VERSION }}
          name: Angerona ${{ env.ANGERONA_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: 'true'
          files: files/*
